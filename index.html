<!DOCTYPE html>
<html lang="en" data-mode="islamic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#f5f4f1">
<meta name="description" content="Photo cards & captions for Facebook — General and Islamic (প্রশান্তির বার্তা)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Post Card">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TF Post Card Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6b4a'/%3E%3Crect x='14' y='12' width='36' height='40' rx='5' fill='%23fbf6e9'/%3E%3Cpath d='M38 20a9 9 0 1 0 0 14 7 7 0 1 1 0-14z' fill='%23c9a227'/%3E%3Crect x='20' y='40' width='24' height='3' rx='1.5' fill='%231f6b4a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;700&family=Tiro+Bangla&family=Galada&family=Baloo+Da+2:wght@500;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@500;700&family=Mina:wght@700&family=Anek+Bangla:wght@500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@500;700&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --bg:#f5f4f1;--surface:#fff;--surface-2:#f0eee9;--text:#1c1b19;--muted:#6b675f;--faint:#a19c92;--line:#e3dfd6;
  --accent:#1f6b4a;--accent-soft:#e3f1ea;--gold:#b8901f;--danger:#b42318;--ok:#1d7a46;
  --warn-bg:#fff7e6;--warn-line:#f3d79a;--warn-text:#7a4b00;
  --sans:'Inter','Hind Siliguri','Nirmala UI','Segoe UI',system-ui,sans-serif;
}
html[data-mode="general"]{--accent:#b4235a;--accent-soft:#fbe7ef}
html[data-theme="dark"]{--bg:#121214;--surface:#1b1b1e;--surface-2:#252529;--text:#ebe9e4;--muted:#a3a09a;--faint:#6f6c66;--line:#333338;--accent-soft:#1d2e27;--warn-bg:#2a2214;--warn-line:#5a4520;--warn-text:#f0c879}
html[data-theme="dark"][data-mode="islamic"]{--accent:#5fbf8e}
html[data-theme="dark"][data-mode="general"]{--accent:#f07aa5;--accent-soft:#36202a}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:var(--accent)}
/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.brand b{font-size:15px;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.ctrls{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .btn.primary{color:#111}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:focus-visible,.seg button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.seg.mode button{padding:7px 14px;font-weight:600}
@media (max-width:640px){.brand small,.lbl{display:none}.seg.mode button{padding:7px 9px}}
/* layout */
.app{max-width:1320px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:18px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.stage{position:sticky;top:74px}
@media (max-width:900px){.stage{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.canvasbox{background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--bg) 0 50%) 0 0/22px 22px;border-radius:14px 14px 0 0;padding:12px;display:flex;justify-content:center}
#cv{max-width:100%;max-height:calc(100vh - 230px);width:auto;height:auto;display:block;touch-action:none;cursor:grab;box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:2px}
@media (max-width:900px){#cv{max-height:70vh}}
#cv.dragging{cursor:grabbing}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line)}
.stagebar .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{font-size:12px;color:var(--muted);padding:0 12px 10px;margin:0}
.warnline{font-size:12.5px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);border-radius:8px;padding:7px 10px;margin:0 12px 10px}
/* panel */
.panel{overflow:hidden}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:6px 6px 0;background:var(--surface-2);scrollbar-width:thin}
.tab{border:0;background:transparent;padding:9px 13px;border-radius:9px 9px 0 0;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 -1px 0 var(--line) inset}
.pane{padding:16px}
.sect{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.sect h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sect h4 small{font-weight:400;color:var(--muted);font-size:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:9px;min-width:0}
.fld:last-child{margin-bottom:0}
.fld small{font-size:11.5px;color:var(--faint)}
.pane input[type=text],.pane input[type=url],.pane input[type=password],.pane input[type=number],.pane select,.pane textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--text);font-size:14px;outline:none}
.pane textarea{resize:vertical;line-height:1.65;font-family:'Hind Siliguri','Nirmala UI',var(--sans)}
.pane input:focus,.pane select:focus,.pane textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.ar{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;font-size:18px;direction:rtl}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.row>.fld{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane input[type=range]{width:100%;accent-color:var(--accent)}
.pane input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface);cursor:pointer}
.colors{display:flex;gap:14px;flex-wrap:wrap}
.colors label{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--text)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.55}
.warn{font-size:12.5px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);padding:8px 10px;border-radius:8px;margin:8px 0;line-height:1.55}
.okbox{font-size:12.5px;background:var(--accent-soft);color:var(--accent);padding:8px 10px;border-radius:8px;margin:8px 0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.meta{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.6}
.meta b{color:var(--text)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-family:'Hind Siliguri','Nirmala UI',sans-serif;font-size:14.5px;line-height:1.6}
.opt .oh{font-size:12px;color:var(--accent);font-weight:600}
.opt .or{font-size:12.5px;color:var(--muted)}
.opt .row{margin-top:6px}
/* template gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tpl{border:2px solid transparent;border-radius:10px;padding:0;background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:center}
.tpl canvas{width:100%;display:block;aspect-ratio:1/1;background:var(--surface-2)}
.tpl span{font-size:11.5px;padding:4px 2px 5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl.on{border-color:var(--accent)}.tpl.on span{color:var(--accent);font-weight:600}
.pals{display:flex;flex-wrap:wrap;gap:6px}
.pal{width:38px;height:28px;border-radius:7px;border:2px solid var(--line);padding:0;overflow:hidden;display:flex}
.pal i{flex:1;display:block}
.pal:hover{border-color:var(--accent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs button{width:60px;height:60px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.prev{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.prev img{width:74px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);flex:none}
.erow{display:grid;grid-template-columns:92px minmax(0,1fr) 40px 44px 30px;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.erow b{font-weight:500;color:var(--text)}.erow .pct{font-size:11.5px;text-align:right}.erow .auto{font-size:10.5px;color:var(--faint);text-align:center;display:block}
.erow .btn{padding:4px 6px}
.prev img.logo{object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/12px 12px}
.lib{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:8px}
.libi{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.libi div{flex:1;min-width:0;font-family:'Hind Siliguri','Nirmala UI',sans-serif}
.libi b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libi small{color:var(--muted);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flash{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
textarea.cap{min-height:260px;font-size:15px!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:12px;padding:12px;max-width:min(96vw,1000px);max-height:96vh;display:flex;flex-direction:column;gap:10px}
.modal-box img{max-width:100%;max-height:calc(96vh - 80px);object-fit:contain;display:block;margin:0 auto}
.modal-box .row{justify-content:center}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13.5px;z-index:90;transition:all .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
html[data-mode="general"] .isl-only{display:none!important}

/* ===== polish ===== */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,.tab,.chip,.btn{touch-action:manipulation}
.top{padding-top:env(safe-area-inset-top)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 20%,var(--gold) 50%,var(--accent) 80%,transparent);opacity:.7}
html[data-mode="islamic"] .brand .logo{background:linear-gradient(135deg,#0f3d24,#1f6b4a);box-shadow:inset 0 0 0 2px #c9a227}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05)}
.btn.primary{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.tab i{font-style:normal}
#pvBtn{display:none}
.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--gold) 14%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));font-size:13px}
.banner b{flex:1 1 180px}
#updateBar{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:95;background:var(--text);color:var(--bg);padding:8px 10px 8px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#updateBar .btn{background:var(--accent);color:#fff;border:0}
.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.7}
@media (min-width:901px){ .tab i{margin-right:5px} }
@media (max-width:900px){
  .top .in{height:54px;padding:0 10px}
  .app{padding:8px 8px calc(86px + env(safe-area-inset-bottom));gap:10px;grid-template-columns:minmax(0,1fr)}
  .stage,.panel{min-width:0}
  .stage{position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:30;border-radius:14px}
  .canvasbox{padding:6px}
  #cv{max-height:var(--pvh,36vh)}
  #pvBtn{display:inline-flex}
  .hint{display:none}
  .warnline{margin:0 8px 6px;font-size:12px;padding:5px 8px}
  .stagebar{flex-wrap:nowrap;overflow-x:auto;padding:7px 8px;gap:6px;justify-content:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .stagebar::-webkit-scrollbar{display:none}
  .stagebar .grp{flex-wrap:nowrap;gap:6px}
  .stagebar .btn,.stagebar .seg button{white-space:nowrap;padding:8px 11px}
  .stagebar .grp{display:contents}
  #monoBtn{order:-7}#pngBtn{order:-6}#shareBtn{order:-5}#undoBtn{order:-4}#redoBtn{order:-3}#ratioSeg{order:-2;flex:none}#pvBtn{order:-1}
  .panel{overflow:visible}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;justify-content:space-around;gap:2px;padding:5px 4px calc(5px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -6px 20px rgba(0,0,0,.07);overflow:visible}
  .tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px 5px;border-radius:12px;font-size:10.5px;line-height:1.15;transition:background .15s,color .15s}
  .tab i{font-size:19px;line-height:1.1}
  .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.on{background:var(--accent-soft);box-shadow:none}
  .pane{padding:12px 10px}
  .sect{padding:12px 11px;border-radius:14px}
  .pane input[type=text],.pane input[type=url],.pane input[type=password],.pane input[type=number],.pane select,.pane textarea{font-size:16px;padding:10px 11px}
  .btn{padding:9px 12px}
  .btn.sm{padding:7px 10px}
  .chip{padding:8px 13px}
  .erow{grid-template-columns:74px minmax(0,1fr) 34px 44px 32px;gap:6px}
  .gallery{grid-template-columns:repeat(3,1fr)}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom))}
  .modal{padding:10px}
}
@media (max-width:560px){
  .brand b,.brand small{display:none}
  .desk-only{display:none!important}
  .seg.mode .lbl{display:inline}
  .seg.mode button{padding:7px 10px}
  .ctrls{gap:5px}
}
@media (display-mode: standalone){ .install-ui{display:none!important} }
/* monetization check */
.monolist{display:flex;flex-direction:column;gap:6px}
.mi{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:13px;line-height:1.5}
.mi .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.mi.ok .ic{background:var(--ok)}.mi.warn .ic{background:#d08a00}.mi.bad .ic{background:var(--danger)}.mi.info .ic{background:#3b6fb6}
.mi b{display:block;font-size:13px}.mi small{display:block;color:var(--muted);font-size:12px}
.mi .btn{margin-top:5px}
.monobtn{font-weight:700}
.monobtn.ok{border-color:var(--ok);color:var(--ok)}.monobtn.warn{border-color:#d08a00;color:#b07400}.monobtn.bad{border-color:var(--danger);color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
.qgen{border:2px solid var(--accent);background:linear-gradient(160deg,var(--accent-soft),color-mix(in srgb,var(--gold) 10%,var(--surface)))}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips .chip{font-size:13px}
.qgbtns{align-items:center}
.btn.big{flex:1 1 180px;padding:12px 14px;font-size:15px}
.qcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;font-family:'Hind Siliguri','Nirmala UI',sans-serif}
.qcard .qh{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
.qcard .qt{font-size:17px;line-height:1.6;white-space:pre-line;font-weight:600}
.qcard .qc{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;line-height:1.65;white-space:pre-line;color:var(--text)}
.qcard .qc b{color:var(--accent)}
#brandNudge input{border:1px solid var(--warn-line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:15px;min-width:0}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><div class="logo">✦</div><div><b>TF Post Card Studio</b><small data-i18n="tagline"></small></div></div>
    <div class="ctrls">
      <div class="seg mode" role="group" aria-label="mode">
        <button type="button" data-mode="general"><span>🌸</span> <span class="lbl" data-i18n="mGeneral"></span></button>

  lines.forEach((l, i) => {

    else if(i === lines.length - 1 && lines.length > 1 && l.length < 90 && refRe.test(l)) o.ref = l.replace(/^[—–-]\s*/, '');
    else body.push(l);

  o.text = body.join('\n');
  const sacred = /বুখার|মুসলিম|তিরমি|দাউদ|নাসা|মাজাহ|সূরা|আয়াত|হাদিস/.test(o.ref);
  if(MODE === 'general') { o.text = (o.arabic ? o.arabic + '\n' : '') + o.text; o.arabic = ''; }
  setFields(Object.assign(o, sacred ? { full: { text: o.text, arabic: o.arabic, ref: o.ref } } : {}), sacred ? 'sacred' : 'manual');
}

/* ================= canvas interaction ================= */
function wireCanvas(){
  const cv = $('cv'); let drag = null; const PTS = new Map(); let pinch = null;
  const pdist = () => { const a = Array.from(PTS.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1; };
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const hit = p => { for(let i = C.regions.length - 1; i >= 0; i--){ const g = C.regions[i]; if(p.x >= g.x && p.x <= g.x + g.w && p.y >= g.y && p.y <= g.y + g.h) return g; } return null; };
  cv.addEventListener('pointerdown', e => {
    const p = pt(e); PTS.set(e.pointerId, { x: e.clientX, y: e.clientY }); try{ cv.setPointerCapture(e.pointerId); }catch(er){}
    if(PTS.size === 2){ pinch = { d: pdist(), z: C.zoom }; drag = null; return; }
    drag = { last: p, start: p, hit: hit(p), moved: false }; cv.classList.add('dragging');
  });
  cv.addEventListener('pointermove', e => {
    if(PTS.has(e.pointerId)) PTS.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pinch && PTS.size >= 2){ if(hasImg()){ C.zoom = clamp(Math.round(pinch.z * pdist() / pinch.d), 100, 300); $('zoom').value = C.zoom; render(); } return; }
    const p = pt(e);
    if(!drag){ const h = hit(p); cv.style.cursor = h && h.k !== 'photo' && h.k !== 'logo' ? 'text' : 'grab'; return; }
    const dx = p.x - drag.last.x, dy = p.y - drag.last.y; drag.last = p;
    if(!drag.moved && Math.hypot(p.x - drag.start.x, p.y - drag.start.y) < 6) return;
    drag.moved = true;
    const k = drag.hit ? drag.hit.k : null, [W, H] = RATIOS[D().ratio], u = Math.min(W, H) / 1080;
    if(k === 'logo'){ const b = B(); b.logoDX += dx / W; b.logoDY += dy / H; }
    else if(k && k !== 'photo'){ const d = D(); d.textY = clamp(d.textY + dy / u, -400, 400); $('textY').value = Math.round(d.textY); }
    else { if(C.pmax.x > 0) C.panX = clamp(C.panX + dx / C.pmax.x, -1, 1); if(C.pmax.y > 0) C.panY = clamp(C.panY + dy / C.pmax.y, -1, 1); }
    render();
  });
  const end = e => { if(e && PTS.has(e.pointerId)) PTS.delete(e.pointerId); if(PTS.size < 2) pinch = null; if(!drag) return; cv.classList.remove('dragging'); if(!drag.moved && drag.hit && drag.hit.k !== 'photo' && drag.hit.k !== 'logo') focusField(drag.hit.k); if(drag.moved) saveSoon(); drag = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => { if(!hasImg()) return; e.preventDefault(); C.zoom = clamp(C.zoom - Math.sign(e.deltaY) * 5, 100, 300); $('zoom').value = C.zoom; render(); }, { passive: false });
}

async function fetchQuranRange(s, from, to){

async function fetchSource(src){

async function verifiedPosts(topic, want){

function hlSelected(){
  const ta = $('f-text'), v = ta.value; let a = ta.selectionStart, b = ta.selectionEnd;
  if(a === b){ toast(t('tSelFirst')); ta.focus(); return; }
  while(a < b && /\s/.test(v[a])) a++; while(b > a && /\s/.test(v[b - 1])) b--;
  const sel = v.slice(a, b).replace(/\*/g, ''); if(!sel){ toast(t('tSelFirst')); return; }
  pushUndo(); F().text = v.slice(0, a) + '*' + sel + '*' + v.slice(b); syncFields(); saveSoon(); render();
}
function hlClear(){ const f = F(); if(!/\*/.test(f.text)) return; pushUndo(); f.text = f.text.replace(/\*/g, ''); syncFields(); saveSoon(); render(); }
function wrapPhrases(text, phrases){
  let out = text, n = 0;
  phrases.forEach(p => {
    p = norm(String(p || '').replace(/\*/g, '')); if(p.length < 2 || n >= 3) return;
    let from = 0;
    while(true){
      const i = out.indexOf(p, from); if(i < 0) return;
      const before = (out.slice(0, i).match(/\*/g) || []).length;
      if(before % 2 === 0){ out = out.slice(0, i) + '*' + p + '*' + out.slice(i + p.length); n++; return; }
      from = i + p.length;
    }
  });
  return { text: out, n };
}
async function hlAuto(){
  const f = F(), plain = String(f.text || '').replace(/\*/g, '');
  if(!norm(plain)){ toast(t('tEmpty')); return; }
  const btn = $('hlAutoBtn'); btn.disabled = true;
  try{
    let phrases = [];
    if(S.gkey){
      try{
        const r = await gemini({ contents: [{ role: 'user', parts: [{ text: 'From this Bengali social-media card text, choose the 1 to 3 most powerful, emotional short phrases (1–4 words each) that should be visually highlighted. Copy each phrase EXACTLY as it appears in the text. Return ONLY JSON {"phrases":[]}.\n\nTEXT:\n' + plain }] }], generationConfig: { temperature: 0.2, responseMimeType: 'application/json' } }, 40000);
        phrases = (parseJson(r.text).phrases || []).filter(p => plain.includes(norm(p)));
      }catch(e){ if(authErr(e)) throw e; }
    }
    if(!phrases.length){
      const words = plain.split(/[\s,।!?;:"“”'‘’()\-—…]+/).filter(Boolean);
      HL_WORDS[MODE].forEach(k => { if(phrases.length < 2){ const w = words.find(x => x === k || (x.startsWith(k) && x.length - k.length <= 3)); if(w && !phrases.includes(w)) phrases.push(w); } });
    }
    const res = wrapPhrases(plain, phrases);
    if(!res.n){ toast(t('tHlNone')); return; }
    pushUndo(); f.text = res.text; syncFields(); saveSoon(); render();
  }catch(e){ toast(aiErr(e)); }
  finally{ btn.disabled = false; }
}

  $('libFile').addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if(!f) return; try{ const j = JSON.parse(await f.text()); const items = (j.library || []).filter(x => x && x.f && typeof x.f.text === 'string' && (x.mode === 'general' || x.mode === 'islamic')); const ids = new Set(LIB.map(x => x.id)); LIB = items.filter(x => !ids.has(x.id)).concat(LIB).slice(0, 500); saveLib(); renderLib(); toast(t('tLibImported')); }catch(er){ toast(t('tBadFile')); } });
  // settings
  $('showKeyBtn').addEventListener('click', () => { const i = $('gKey'); i.type = i.type === 'password' ? 'text' : 'password'; });
  const readKey = () => { S.gkey = $('gKey').value.trim(); S.gmodel = $('gModel').value.trim(); S.imodel = $('iModel').value.trim(); MODELS = null; };
  $('saveKeyBtn').addEventListener('click', () => { readKey(); store.set('gkey', S.gkey); store.set('gmodel', S.gmodel); store.set('imodel', S.imodel); refreshKeyHints(); toast(t('tSaved')); });
  $('rmKeyBtn').addEventListener('click', () => { S.gkey = ''; store.set('gkey', ''); $('gKey').value = ''; MODELS = null; refreshKeyHints(); $('keyState').textContent = ''; toast(t('tRemoved')); });
  $('testKeyBtn').addEventListener('click', async () => {
    readKey(); if(!S.gkey){ toast(t('tNoKey')); return; }
    $('keyState').textContent = '…';
    try{ const r = await gemini({ contents: [{ role: 'user', parts: [{ text: 'Reply with OK' }] }] }, 30000); let im = ''; try{ im = ' · 🎨 ' + await resolveImageModel(); }catch(e){ im = ' · 🎨 ' + aiErr(e); } $('keyState').textContent = t('tKeyOk') + ' (' + r.model + ')' + im; }
    catch(e){ $('keyState').textContent = t('tKeyBad') + ': ' + aiErr(e); }
  });
  $('undoBtn').addEventListener('click', histUndo); $('redoBtn').addEventListener('click', histRedo);
  document.addEventListener('keydown', e => { if(!(e.ctrlKey || e.metaKey) || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return; const k = e.key.toLowerCase(); if(k === 'z' && !e.shiftKey){ e.preventDefault(); histUndo(); } else if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); histRedo(); } });
  $('aiPostBtn').addEventListener('click', aiFullPost);
  $('qgNext').addEventListener('click', () => qgGenerate(false));
  $('stNext').addEventListener('click', stGenerate);
  $('stPrev').addEventListener('click', stBack);
  $('stClear').addEventListener('click', () => { if(!confirm(t('stConfirmClear'))) return; store.set('st_hist_' + MODE, []); stBuildUi(); toast(t('qgCleared')); });
  document.querySelectorAll('#stKind [data-kind]').forEach(b => b.addEventListener('click', () => { ST_KIND = b.dataset.kind; store.set('st_kind', ST_KIND); stBuildUi(); }));
  document.querySelectorAll('#stImg [data-img]').forEach(b => b.addEventListener('click', () => { ST_IMG = b.dataset.img; store.set('st_img', ST_IMG); stBuildUi(); }));
  $('stMore').checked = store.get('chk_stMore', true); $('stMore').addEventListener('change', () => store.set('chk_stMore', $('stMore').checked));
  $('qgRand').addEventListener('click', () => qgGenerate(true));
  $('qgPrev').addEventListener('click', qgBack);
  $('qgClear').addEventListener('click', () => { if(!confirm(t('qgConfirmClear'))) return; store.set('qg_hist_' + MODE, []); store.set('qg_angles_' + MODE, []); qgCountUi(); toast(t('qgCleared')); });
  document.querySelectorAll('#qgTone [data-tone]').forEach(b => b.addEventListener('click', () => { QG_TONE = b.dataset.tone; store.set('qg_tone', QG_TONE); document.querySelectorAll('#qgTone [data-tone]').forEach(x => x.classList.toggle('on', x === b)); }));
  $('qgCap').checked = store.get('chk_qgCap', true); $('qgCap').addEventListener('change', () => store.set('chk_qgCap', $('qgCap').checked));
  initPwa(); applyPv(); syncThemeColor();
  $('pvBtn').addEventListener('click', () => { store.set('pv', (store.get('pv', 0) + 1) % PV_SIZES.length); applyPv(); });
  $('langBtn2').addEventListener('click', () => $('langBtn').click());
  $('themeBtn2').addEventListener('click', () => $('themeBtn').click());
  $('themeBtn').addEventListener('click', () => { syncThemeColor(); applyI18n(); });
  ['hlSelBtn', 'hlAutoBtn', 'hlClearBtn'].forEach(id => $(id).addEventListener('mousedown', e => e.preventDefault()));
  $('hlSelBtn').addEventListener('click', hlSelected); $('hlAutoBtn').addEventListener('click', hlAuto); $('hlClearBtn').addEventListener('click', hlClear);
  $('aiImgBtn').addEventListener('click', aiImageForPost);
  $('styleEx').addEventListener('input', () => store.set('style_' + MODE, $('styleEx').value));
  $('styleResetBtn').addEventListener('click', () => { $('styleEx').value = DEF_STYLE[MODE]; store.set('style_' + MODE, DEF_STYLE[MODE]); });
  ['aiSource'].forEach(id => { const v = store.get('sel_' + id, null); if(v) $(id).value = v; $(id).addEventListener('change', () => store.set('sel_' + id, $(id).value)); });
  $('resetDesignBtn').addEventListener('click', resetModeDesign);
  $('resetBrandBtn').addEventListener('click', resetBrand);
  $('presetSaveBtn').addEventListener('click', savePreset);
  $('fullBackupBtn').addEventListener('click', fullBackup);
  $('fullRestoreBtn').addEventListener('click', () => $('fullFile').click());
  $('fullFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if(f) fullRestore(f); });
  $('masterResetBtn').addEventListener('click', () => masterReset());
  $('hdrResetBtn').addEventListener('click', () => $('resetModal').classList.remove('hidden'));
  $('rsCancelBtn').addEventListener('click', () => $('resetModal').classList.add('hidden'));
  $('resetModal').addEventListener('click', e => { if(e.target === $('resetModal')) $('resetModal').classList.add('hidden'); });
  $('rsKeepBtn').addEventListener('click', () => masterReset(true));
  $('rsAllBtn').addEventListener('click', () => { if(confirm(t('confirmMaster'))) masterReset(false); });
  $('rsBackupBtn').addEventListener('click', fullBackup);
  $('resetAllBtn').addEventListener('click', () => { if(!confirm(t('confirmDesign'))) return; DESIGN.general = defDesign('general'); DESIGN.islamic = defDesign('islamic'); saveSoon(); syncDesign(); render(); toast(t('tSaved')); });
  // export
  $('pngBtn').addEventListener('click', () => downloadCard('png'));
  $('jpgBtn').addEventListener('click', () => downloadCard('jpg'));
  $('previewBtn').addEventListener('click', preview);
  $('shareBtn').addEventListener('click', shareCard);
  try{ if(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] }) ) $('shareBtn').classList.remove('hidden'); }catch(e){}
  $('modalBack').addEventListener('click', () => $('modal').classList.add('hidden'));
  $('modalDl').addEventListener('click', () => { $('modal').classList.add('hidden'); downloadCard('png'); });
  $('modal').addEventListener('click', e => { if(e.target === $('modal')) $('modal').classList.add('hidden'); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ $('modal').classList.add('hidden'); $('resetModal').classList.add('hidden'); $('installModal').classList.add('hidden'); } });
  wireCanvas();
  if(document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { render(); });
  setMode(MODE); updateImgUi(); renderAiThumbs(); refreshKeyHints();
  ensureFonts().then(() => { render(); renderGallery(); });
}
window.TFPC = { state: C, F: () => F(), D: () => D(), B: () => B(), renderTo, setMode, showTab };
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
